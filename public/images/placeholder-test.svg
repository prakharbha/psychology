<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d4a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0.7" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  <rect width="800" height="600" fill="url(#gridPattern)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="rgba(255,255,255,0.03)"/>
  <circle cx="700" cy="500" r="80" fill="rgba(255,255,255,0.03)"/>
  <circle cx="650" cy="150" r="40" fill="rgba(255,255,255,0.04)"/>
  
  <!-- Main icon - Psychology/Testing symbol -->
  <g transform="translate(400, 250)">
    <!-- Brain/Chart icon -->
    <circle cx="0" cy="0" r="80" fill="url(#iconGradient)" opacity="0.15"/>
    
    <!-- Chart bars representing assessment -->
    <rect x="-60" y="20" width="12" height="60" rx="6" fill="rgba(255,255,255,0.6)"/>
    <rect x="-40" y="10" width="12" height="70" rx="6" fill="rgba(255,255,255,0.7)"/>
    <rect x="-20" y="0" width="12" height="80" rx="6" fill="rgba(255,255,255,0.8)"/>
    <rect x="0" y="15" width="12" height="65" rx="6" fill="rgba(255,255,255,0.7)"/>
    <rect x="20" y="5" width="12" height="75" rx="6" fill="rgba(255,255,255,0.75)"/>
    <rect x="40" y="25" width="12" height="55" rx="6" fill="rgba(255,255,255,0.65)"/>
    <rect x="60" y="10" width="12" height="70" rx="6" fill="rgba(255,255,255,0.7)"/>
    
    <!-- Document/Test icon overlay -->
    <rect x="-25" y="-50" width="50" height="35" rx="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="-15" y1="-40" x2="15" y2="-40" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <line x1="-15" y1="-30" x2="10" y2="-30" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Psychological Test
  </text>
  <text x="400" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Prakhar Psychological Testing
  </text>
</svg>
